project_id = "icrkipwlnuopqbsabngy"

# ── API ──────────────────────────────────────────────
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# ── Auth ─────────────────────────────────────────────
[auth]
enabled = true
site_url = "https://app.sita.os"
additional_redirect_urls = [
  "https://app.sita.os/**",
  "http://localhost:5173/**",
  "http://localhost:8080/**"
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = true
# client_id and secret are set in Supabase Dashboard → Auth → Providers
# redirect_uri is auto-generated: https://<project>.supabase.co/auth/v1/callback

# ── Edge Functions ───────────────────────────────────
# Lovable auto-deploys with verify_jwt = false.
# All functions validate JWT in-code via requireAuth() / getClaims().
# For self-hosted: set verify_jwt = true per function as needed.

[functions.main]
verify_jwt = false

