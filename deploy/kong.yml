# ═══════════════════════════════════════════════════════════════
# SITA OS — Kong Declarative Configuration
# Routes requests to Supabase services with rate limiting
# ═══════════════════════════════════════════════════════════════

_format_version: "2.1"
_transform: true

services:
  # ── PostgREST (REST API) ───────────────────────────────────────
  - name: rest-v1
    url: http://sita-supabase-rest:3000
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: rate-limiting
        config:
          minute: 500
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # ── GoTrue Auth ────────────────────────────────────────────────
  - name: auth-v1
    url: http://sita-supabase-auth:9999
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: rate-limiting
        config:
          minute: 20
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # ── Realtime ───────────────────────────────────────────────────
  - name: realtime-v1
    url: http://sita-supabase-realtime:4000
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors

  # ── Storage ────────────────────────────────────────────────────
  - name: storage-v1
    url: http://sita-supabase-storage:5000
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: rate-limiting
        config:
          minute: 300
          policy: local
          fault_tolerant: true

  # ── Postgres Meta ───────────────────────────────────────────────
  - name: meta
    url: http://sita-supabase-meta:8080
    routes:
      - name: meta-route
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: cors
      - name: rate-limiting
        config:
          minute: 100
          policy: local
          fault_tolerant: true

  # ── Edge Functions ────────────────────────────────────────────
  - name: functions-v1
    url: http://sita-supabase-functions:9000
    routes:
      - name: functions-v1-route
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
      - name: rate-limiting
        config:
          minute: 200
          policy: local
          fault_tolerant: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${SUPABASE_ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SUPABASE_SERVICE_KEY}

plugins:
  # Global CORS
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - apikey
        - x-client-info
      exposed_headers:
        - Content-Range
      max_age: 3600
      credentials: true

  # Global request ID
  - name: request-transformer
    config:
      add:
        headers:
          - "X-Request-Id:$(uuid)"

  # Global rate limit fallback (1000 req/min per IP)
  - name: rate-limiting
    config:
      minute: 1000
      policy: local
      fault_tolerant: true
      hide_client_headers: false
