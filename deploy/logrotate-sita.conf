# ═══════════════════════════════════════════════════════════════
# SITA OS — Log Rotation Configuration
# Install: sudo cp logrotate-sita.conf /etc/logrotate.d/sita
# ═══════════════════════════════════════════════════════════════

/var/log/sita-*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 root adm
    sharedscripts
    postrotate
        systemctl reload rsyslog 2>/dev/null || true
    endscript
}

/var/log/sita-first-boot.log {
    size 10M
    missingok
    rotate 3
    compress
    notifempty
    create 0640 root adm
}
