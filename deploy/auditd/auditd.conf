# ═══════════════════════════════════════════════════════════════
# SITA OS — Auditd Configuration
# VM-level access logging for security compliance
# ═══════════════════════════════════════════════════════════════

# Log file settings
log_file = /var/log/audit/audit.log
log_format = ENRICHED
log_group = root
priority_boost = 4
flush = INCREMENTAL_ASYNC
freq = 50
num_logs = 10
max_log_file = 50
max_log_file_action = ROTATE
space_left = 75
space_left_action = SYSLOG
admin_space_left = 50
admin_space_left_action = SUSPEND
disk_full_action = SUSPEND
disk_error_action = SUSPEND
