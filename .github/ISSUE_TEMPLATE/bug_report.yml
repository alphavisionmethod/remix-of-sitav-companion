name: Bug Report
description: Report a bug in SITA OS
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "## Bug Report"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce this behavior
      value: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low (cosmetic)
        - Medium (workaround exists)
        - High (blocks workflow)
        - Critical (data loss / security)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Frontend / UI
        - Backend / Edge Functions
        - Database
        - Authentication
        - AI / Advisors
        - Connectors
        - Admin Console
        - Desktop / Electron
        - Mobile
        - CI / CD
        - Other
    validations:
      required: true