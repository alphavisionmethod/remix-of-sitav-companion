name: Feature Request
description: Suggest a feature for SITA OS
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "## Feature Request"
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend / UI
        - Backend / Edge Functions
        - AI / Advisors
        - Connectors
        - Admin Console
        - Desktop / OS
        - Infrastructure
        - Other
    validations:
      required: true