name: "Setup Node Project"
description: "Checkout, setup Node 20, install dependencies via npm ci"
inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "20"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      if: ${{ !env.ALREADY_CHECKED_OUT }}
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm ci
      shell: bash