name: "Setup Node Project"
description: >
  Composite action: checkout repo, setup Node.js with npm cache,
  install dependencies. Skips checkout if already done.
inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "20"
  install-args:
    description: "Extra args passed to npm ci (e.g. --ignore-scripts)"
    required: false
    default: ""
  skip-checkout:
    description: "Set to 'true' if repo is already checked out"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Checkout
      if: ${{ inputs.skip-checkout != 'true' }}
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci ${{ inputs.install-args }}
      shell: bash