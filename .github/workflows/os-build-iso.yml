# ═══════════════════════════════════════════════════════════════════════
# SITA OS — ISO Build Pipeline
# Builds a bootable hybrid BIOS+UEFI ISO on a free GitHub Actions runner.
# ═══════════════════════════════════════════════════════════════════════
name: sita-os-build-iso

on:
  push:
    branches: [main]
    paths:
      - 'os/**'
      - '.github/workflows/os-build-iso.yml'
  schedule:
    # Nightly end-to-end build at 04:00 UTC — produces fresh ISO/IMG + SBOM
    # + attestation + QEMU smoke for both user and operator profiles.
    - cron: '0 4 * * *'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.1.0-dev)'
        required: false
        default: '0.1.0-dev'

permissions:
  contents: read

concurrency:
  group: os-build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SITA OS ISO (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [user, operator]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Decode MOK signing key (if present)
        env:
          SITA_MOK_KEY_BASE64: ${{ secrets.SITA_MOK_KEY_BASE64 }}
          SITA_MOK_CERT_BASE64: ${{ secrets.SITA_MOK_CERT_BASE64 }}
        run: |
          if [ -n "$SITA_MOK_KEY_BASE64" ] && [ -n "$SITA_MOK_CERT_BASE64" ]; then
            echo "$SITA_MOK_KEY_BASE64"  | base64 -d > "$RUNNER_TEMP/mok.key"
            echo "$SITA_MOK_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/mok.crt"
            echo "SITA_MOK_KEY=$RUNNER_TEMP/mok.key"   >> "$GITHUB_ENV"
            echo "SITA_MOK_CERT=$RUNNER_TEMP/mok.crt"  >> "$GITHUB_ENV"
            echo "::notice::Production MOK loaded"
          else
            echo "::warning::No MOK secrets — build will use ephemeral dev key (UNSIGNED for production)"
          fi

      - name: Build ISO (profile=${{ matrix.profile }})
        env:
          VERSION: ${{ github.event.inputs.version || format('0.1.0-dev+{0}', github.run_number) }}
          SITA_PROFILE: ${{ matrix.profile }}
        run: sudo -E bash os/image-builder/build.sh --profile=${{ matrix.profile }}

      - name: Verify boot artifacts
        run: sudo -E bash os/scripts/verify-boot-artifacts.sh out

      - name: Verify verity metadata
        run: sudo -E bash os/scripts/verify-verity-metadata.sh out || echo "::warning::verity verification skipped (artifacts not present in this build profile)"

      - name: Build raw IMG (flashable + cloud import)
        env:
          VERSION: ${{ github.event.inputs.version || format('0.1.0-dev+{0}', github.run_number) }}
        run: sudo -E bash os/scripts/build-raw-img.sh

      - name: Phase 4 — Install supply-chain tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            tpm2-tools sbsigntool jq xxd uuid-runtime || true

      - name: Phase 4 — Seal verity to TPM (offline)
        env:
          VERSION: ${{ github.event.inputs.version || format('0.1.0-dev+{0}', github.run_number) }}
        run: |
          if [ -f out/verity-metadata.json ]; then
            ROOT_HASH="$(jq -r '.root_hash // empty' out/verity-metadata.json)"
            if [ -n "$ROOT_HASH" ] && command -v tpm2_createpolicy >/dev/null 2>&1; then
              SITA_VERSION="$VERSION" bash os/scripts/seal-verity-to-tpm.sh "$ROOT_HASH"
              bash os/scripts/verify-tpm-seal.sh --offline
            else
              echo "::warning::Skipping TPM seal — no root hash or tpm2-tools"
            fi
          else
            echo "::warning::Skipping TPM seal — verity-metadata.json absent"
          fi

      - name: Phase 4 — Enroll Secure Boot MOK + sign chain
        env:
          VERSION: ${{ github.event.inputs.version || format('0.1.0-dev+{0}', github.run_number) }}
          SITA_MOK_KEY:  ${{ env.SITA_MOK_KEY }}
          SITA_MOK_CERT: ${{ env.SITA_MOK_CERT }}
        run: |
          SITA_VERSION="$VERSION" bash os/scripts/enroll-secureboot-mok.sh || \
            echo "::warning::MOK enrollment partially skipped"

      - name: Phase 4 — Generate signed CycloneDX SBOMs
        env:
          VERSION: ${{ github.event.inputs.version || format('0.1.0-dev+{0}', github.run_number) }}
        run: |
          SITA_VERSION="$VERSION" bash os/scripts/generate-sbom.sh
          for s in generated/sbom-electron-${VERSION}.cdx.json generated/sbom-os-${VERSION}.cdx.json; do
            [ -f "$s" ] && bash os/scripts/verify-sbom.sh "$s" || true
          done

      - name: Emit attestation
        run: bash os/scripts/emit-attestation.sh

      - name: Inspect output
        run: |
          ls -lh out/ generated/ || true
          cat out/*.manifest.json
          cat generated/os-build-summary.md || true

      - name: Wave 6 — Verify ISO artifact presence
        env:
          SITA_RELEASE_MODE: ci
        run: npx tsx scripts/architecture/checks/check-iso-artifact-presence.ts

      - name: Wave 6 — Verify RAW IMG artifact presence
        env:
          SITA_RELEASE_MODE: ci
        run: npx tsx scripts/architecture/checks/check-raw-img-artifact-presence.ts

      - name: Cleanup MOK
        if: always()
        run: rm -f "$RUNNER_TEMP/mok.key" "$RUNNER_TEMP/mok.crt"

      - name: Upload ISO + attestation + supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sita-os-iso-${{ matrix.profile }}
          path: |
            out/*.iso
            out/*.img
            out/*.sha256
            out/*.manifest.json
            out/os-*-receipt.json
            out/verity-receipt.json
            out/verity-metadata.json
            out/os-verification-report.json
            out/tpm-seal-*
            out/secureboot/**
            generated/os-build-attestation.json
            generated/os-build-summary.md
            generated/sbom-electron-*.cdx.json
            generated/sbom-electron-*.cdx.json.sig
            generated/sbom-electron-*.cdx.json.sha256
            generated/sbom-os-*.cdx.json
            generated/sbom-os-*.cdx.json.sig
            generated/sbom-os-*.cdx.json.sha256
          # Bump retention on release-triggered builds (90 days vs 14 day default)
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "## 🚀 SITA OS Build"
            echo ""
            if [ -f out/*.manifest.json ]; then
              echo "\`\`\`json"
              cat out/*.manifest.json
              echo "\`\`\`"
            else
              echo "❌ Build failed — no manifest produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: QEMU Smoke Test (${{ matrix.profile }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [user, operator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sita-os-iso-${{ matrix.profile }}
          path: out/

      - name: Install QEMU + OVMF
        run: sudo apt-get update -qq && sudo apt-get install -y qemu-system-x86 ovmf

      - name: QEMU production validation (assertions, 180s)
        env:
          SITA_QEMU_TIMEOUT: "180"
        run: bash os/qemu-validate.sh

      - name: Upload QEMU validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-validation-${{ matrix.profile }}
          path: |
            out/qemu-validation.log
            out/qemu-validation-report.json
            out/qemu-validation-report.md
          retention-days: 14
          if-no-files-found: warn

  publish-iso:
    name: Publish ISO to GitHub Release (${{ matrix.profile }})
    needs: [build, smoke-test]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        profile: [user, operator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sita-os-iso-${{ matrix.profile }}
          path: release-assets/

      - name: Stage release assets
        run: |
          mkdir -p staged
          # Flatten + namespace by profile so user/operator artifacts don't collide
          for f in release-assets/out/*.iso release-assets/out/*.img release-assets/out/*.sha256 \
                   release-assets/out/*.manifest.json release-assets/out/verity-metadata.json \
                   release-assets/generated/os-build-attestation.json \
                   release-assets/generated/sbom-electron-*.cdx.json \
                   release-assets/generated/sbom-electron-*.cdx.json.sig \
                   release-assets/generated/sbom-os-*.cdx.json \
                   release-assets/generated/sbom-os-*.cdx.json.sig; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            cp "$f" "staged/sita-os-${{ matrix.profile }}-${base}"
          done
          ls -lh staged/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: staged/*
          fail_on_unmatched_files: false
          tag_name: ${{ github.event.release.tag_name }}

  # ─────────────────────────────────────────────────────────────────────
  # Wave 6 — VMware OVA appliance build
  # Wraps the user-profile ISO into a deployable .ova on release events
  # and on workflow_dispatch (large artifact; not built on every commit).
  # ─────────────────────────────────────────────────────────────────────
  build-ova:
    name: Build VMware OVA appliance
    needs: [build, smoke-test]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sita-os-iso-user
          path: out/

      - name: Install OVA build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-utils qemu-system-x86 ovmf xorriso tar

      - name: Build OVA appliance
        run: |
          ISO="$(ls -t out/sita-os-*-amd64.iso 2>/dev/null | head -1)"
          if [ -z "$ISO" ]; then echo "::error::No ISO found to wrap"; exit 1; fi
          bash os/vmware/build-ova.sh "$ISO"

      - name: Wave 6 — Verify OVA artifact presence
        env:
          SITA_RELEASE_MODE: ci
        run: npx tsx scripts/architecture/checks/check-ova-artifact-presence.ts

      - name: Inspect OVA output
        run: |
          ls -lh out/*.ova out/*.ova.sha256 out/*.ova.manifest.json
          cat out/*.ova.manifest.json

      - name: Upload OVA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sita-os-ova
          path: |
            out/*.ova
            out/*.ova.sha256
            out/*.ova.manifest.json
          retention-days: ${{ github.event_name == 'release' && 90 || 14 }}
          if-no-files-found: error

      - name: Attach OVA to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/*.ova
            out/*.ova.sha256
            out/*.ova.manifest.json
          fail_on_unmatched_files: false
          tag_name: ${{ github.event.release.tag_name }}

