# ═══════════════════════════════════════════════════════════════════════
# SITA OS — ISO Build Pipeline
# Builds a bootable hybrid BIOS+UEFI ISO on a free GitHub Actions runner.
# ═══════════════════════════════════════════════════════════════════════
name: sita-os-build-iso

on:
  push:
    branches: [main]
    paths:
      - 'os/**'
      - '.github/workflows/os-build-iso.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.1.0-dev)'
        required: false
        default: '0.1.0-dev'

permissions:
  contents: read

jobs:
  build:
    name: Build SITA OS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h

      - name: Decode MOK signing key (if present)
        env:
          SITA_MOK_KEY_BASE64: ${{ secrets.SITA_MOK_KEY_BASE64 }}
          SITA_MOK_CERT_BASE64: ${{ secrets.SITA_MOK_CERT_BASE64 }}
        run: |
          if [ -n "$SITA_MOK_KEY_BASE64" ] && [ -n "$SITA_MOK_CERT_BASE64" ]; then
            echo "$SITA_MOK_KEY_BASE64"  | base64 -d > "$RUNNER_TEMP/mok.key"
            echo "$SITA_MOK_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/mok.crt"
            echo "SITA_MOK_KEY=$RUNNER_TEMP/mok.key"   >> "$GITHUB_ENV"
            echo "SITA_MOK_CERT=$RUNNER_TEMP/mok.crt"  >> "$GITHUB_ENV"
            echo "::notice::Production MOK loaded"
          else
            echo "::warning::No MOK secrets — build will use ephemeral dev key (UNSIGNED for production)"
          fi

      - name: Build ISO
        env:
          VERSION: ${{ github.event.inputs.version || format('0.1.0-dev+{0}', github.run_number) }}
        run: sudo -E bash os/image-builder/build.sh

      - name: Verify boot artifacts
        run: sudo -E bash os/scripts/verify-boot-artifacts.sh out

      - name: Verify verity metadata
        run: sudo -E bash os/scripts/verify-verity-metadata.sh out || echo "::warning::verity verification skipped (artifacts not present in this build profile)"

      - name: Build raw IMG (flashable + cloud import)
        env:
          VERSION: ${{ github.event.inputs.version || format('0.1.0-dev+{0}', github.run_number) }}
        run: sudo -E bash os/scripts/build-raw-img.sh

      - name: Emit attestation
        run: bash os/scripts/emit-attestation.sh

      - name: Phase 4 — Seal verity root to TPM 2.0 (simulated on CI)
        run: bash os/scripts/seal-verity-to-tpm.sh

      - name: Phase 4 — Enroll Secure Boot / MOK shim chain
        run: |
          sudo apt-get install -y shim-signed sbsigntool grub-efi-amd64-bin || true
          bash os/scripts/enroll-secureboot-mok.sh

      - name: Phase 4 — Generate + sign CycloneDX SBOMs
        env:
          VERSION: ${{ github.event.inputs.version || format('0.1.0-dev+{0}', github.run_number) }}
        run: bash os/scripts/generate-sbom.sh

      - name: Phase 4 — Verify TPM seal + SBOM signatures
        run: |
          bash os/scripts/verify-tpm-seal.sh out
          bash os/scripts/verify-sbom.sh     out

      - name: Inspect output
        run: |
          ls -lh out/ generated/ || true
          cat out/*.manifest.json
          cat out/tpm-seal.manifest.json   2>/dev/null || true
          cat out/shim/mok-enroll.json     2>/dev/null || true
          cat out/sbom.manifest.json       2>/dev/null || true
          cat generated/os-build-summary.md || true

      - name: Cleanup MOK
        if: always()
        run: rm -f "$RUNNER_TEMP/mok.key" "$RUNNER_TEMP/mok.crt"

      - name: Upload ISO + attestation + Phase 4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sita-os-iso
          path: |
            out/*.iso
            out/*.img
            out/*.sha256
            out/*.manifest.json
            out/os-*-receipt.json
            out/verity-receipt.json
            out/os-verification-report.json
            out/tpm-seal.manifest.json
            out/tpm-seal.policy
            out/tpm-seal.pub
            out/tpm-seal.priv
            out/shim/mok-enroll.json
            out/shim/MOK.cer
            out/shim/MOK.fingerprint
            out/sbom-app.cdx.json
            out/sbom-os.cdx.json
            out/sbom-os.cdx.json.sig
            out/sbom.manifest.json
            generated/os-build-attestation.json
            generated/os-build-summary.md
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "## 🚀 SITA OS Build"
            echo ""
            if [ -f out/*.manifest.json ]; then
              echo "\`\`\`json"
              cat out/*.manifest.json
              echo "\`\`\`"
            else
              echo "❌ Build failed — no manifest produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: QEMU Smoke Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sita-os-iso
          path: out/

      - name: Install QEMU + OVMF
        run: sudo apt-get update -qq && sudo apt-get install -y qemu-system-x86 ovmf

      - name: QEMU production validation (assertions, 180s)
        env:
          SITA_QEMU_TIMEOUT: "180"
        run: bash os/qemu-validate.sh

      - name: Upload QEMU validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-validation
          path: |
            out/qemu-validation.log
            out/qemu-validation-report.json
            out/qemu-validation-report.md
          retention-days: 14
          if-no-files-found: warn
