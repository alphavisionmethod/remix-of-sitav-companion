name: E2E Customer Journey Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run P0 Customer Journey Tests
        run: npx playwright test tests/e2e/customer-journey/ --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Generate Journey Summary
        if: always()
        run: |
          echo "## 📊 Customer Journey P0 Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          FAIL_COUNT=0
          PASS_COUNT=0
          if [ -d "test-results/journey-reports" ]; then
            for f in test-results/journey-reports/*.json; do
              if [ -f "$f" ]; then
                FAILS=$(cat "$f" | grep -c '"status": "fail"' || true)
                PASSES=$(cat "$f" | grep -c '"status": "pass"' || true)
                FAIL_COUNT=$((FAIL_COUNT + FAILS))
                PASS_COUNT=$((PASS_COUNT + PASSES))
              fi
            done
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASS_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAIL_COUNT |" >> $GITHUB_STEP_SUMMARY
            if [ "$FAIL_COUNT" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ⚠️ Failed Journeys" >> $GITHUB_STEP_SUMMARY
              for f in test-results/journey-reports/*.json; do
                if [ -f "$f" ]; then
                  grep -B2 '"status": "fail"' "$f" | grep '"journey_key"' | sed 's/.*"journey_key": "\(.*\)".*/- `\1`/' >> $GITHUB_STEP_SUMMARY || true
                fi
              done
            fi
          else
            echo "⚠️ No journey reports generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on P0 Launch-Critical Regressions
        if: always()
        run: |
          if [ -d "test-results/journey-reports" ]; then
            CRITICAL_FAILS=$(grep -l '"status": "fail"' test-results/journey-reports/*.json 2>/dev/null | wc -l || echo 0)
            if [ "$CRITICAL_FAILS" -gt 0 ]; then
              echo "::error::$CRITICAL_FAILS P0 journey(s) failed — merge blocked"
              exit 1
            fi
          fi

      - name: Ingest Journey Results to DB
        if: always()
        run: npx tsx scripts/ingest-journey-results.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          RESULTS_DIR: test-results/journey-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
