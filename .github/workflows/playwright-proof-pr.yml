# ═══════════════════════════════════════════════════════
# SITA OS — Playwright Proof PR Workflow
# Runs behavioral proof on every PR and push to main/develop
# ═══════════════════════════════════════════════════════

name: Playwright Proof (PR)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  proof:
    name: Behavioral Proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Run Playwright Suite
        run: |
          npx serve dist -l 8080 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 > /dev/null && break || sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://localhost:8080 npx playwright test \
            --reporter=html,list,./tests/e2e/reporters/journey-reporter.ts \
            || E2E_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true

          # Post proof summary to GH step summary
          if [ -f test-results/journey-reports/proof-summary.md ]; then
            cat test-results/journey-reports/proof-summary.md >> $GITHUB_STEP_SUMMARY
          fi

          # Only fail on launch_blocker loops if all passed tests are 0
          BLOCKER_FAILURES=$(cat test-results/journey-reports/flagship-loop-proof-summary.json 2>/dev/null | \
            node -e "
              const d=require('fs').readFileSync('/dev/stdin','utf8');
              const s=JSON.parse(d);
              const blockers=s.filter(l=>l.launch_impact==='launch_blocker'&&l.failed>0);
              console.log(blockers.length);
            " 2>/dev/null || echo "0")

          if [ "$BLOCKER_FAILURES" != "0" ]; then
            echo "::warning::Launch-blocker loop failures detected ($BLOCKER_FAILURES loops)"
          fi

          exit ${E2E_EXIT:-0}
        env:
          CI: true
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: test-results/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flagship-loop-proof
          path: test-results/journey-reports/
          retention-days: 30
