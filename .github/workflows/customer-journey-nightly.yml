name: Customer Journey Nightly Verification

on:
  schedule:
    - cron: '0 6,18 * * *'  # 6am and 6pm UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run P0 + P1 + Demo-vs-Real Customer Journey Tests
        run: npx playwright test tests/e2e/customer-journey/ --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Generate Journey Summary
        if: always()
        run: |
          echo "## 📊 Customer Journey Nightly Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "test-results/journey-reports" ]; then
            for f in test-results/journey-reports/*.json; do
              if [ -f "$f" ]; then
                echo "### Results from $(basename $f)" >> $GITHUB_STEP_SUMMARY
                echo '```json' >> $GITHUB_STEP_SUMMARY
                cat "$f" | head -100 >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "⚠️ No journey reports generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Ingest Journey Results to DB
        if: always()
        run: npx tsx scripts/ingest-journey-results.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          RESULTS_DIR: test-results/journey-reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-journey-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30
