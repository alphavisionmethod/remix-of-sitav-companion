# ═══════════════════════════════════════════════════════════════
# SITA OS — CI/CD Pipeline
# Build, test, lint, typecheck, E2E, and truth validation
# ═══════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # Nightly full validation

env:
  NODE_VERSION: "20"

jobs:
  # ── Typecheck ─────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: TypeScript Check
        run: npx tsc --noEmit

  # ── Lint ──────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npx eslint src/ --max-warnings 0 || true

  # ── Unit Tests ────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run Unit Tests
        run: npx vitest run --reporter=verbose --coverage || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: coverage/
          retention-days: 14

  # ── Build ─────────────────────────────────────────────────
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:8000
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-ci
          VITE_SUPABASE_PROJECT_ID: ci-project
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── E2E P0 Tests ──────────────────────────────────────────
  e2e-p0:
    name: E2E P0 Journeys
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Run E2E Tests
        run: npx playwright test --reporter=html
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://localhost:8000' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'dummy-key' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'ci-project' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 14

  # ── Truth Validation ──────────────────────────────────────
  truth-validation:
    name: Truth Validation
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-p0]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate Truth Report
        run: |
          node -e "
          const report = {
            timestamp: new Date().toISOString(),
            branch: process.env.GITHUB_REF_NAME || 'unknown',
            commit: process.env.GITHUB_SHA?.slice(0,8) || 'unknown',
            jobs: {
              typecheck: '${{ needs.typecheck.result || 'skipped' }}',
              lint: '${{ needs.lint.result || 'skipped' }}',
              unit_tests: '${{ needs.unit-tests.result || 'skipped' }}',
              build: '${{ needs.build.result || 'skipped' }}',
              e2e_p0: '${{ needs.e2e-p0.result || 'skipped' }}',
            },
            launch_gate: Object.values({
              typecheck: '${{ needs.typecheck.result }}',
              build: '${{ needs.build.result }}',
              e2e: '${{ needs.e2e-p0.result }}',
            }).every(r => r === 'success') ? 'eligible' : 'blocked',
          };
          console.log(JSON.stringify(report, null, 2));
          require('fs').writeFileSync('truth-report.json', JSON.stringify(report, null, 2));
          if (report.launch_gate === 'blocked') {
            console.log('::warning::Launch gate BLOCKED — not all required jobs passed');
          }
          "
      - uses: actions/upload-artifact@v4
        with:
          name: truth-report
          path: truth-report.json
          retention-days: 30
