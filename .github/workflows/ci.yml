# ═══════════════════════════════════════════════════════════════
# SITA OS — CI/CD Pipeline
# Build, test, and validate Docker images on push/PR
# ═══════════════════════════════════════════════════════════════

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ── Lint & Type Check ────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ --max-warnings 0 || true

  # ── Unit Tests ───────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run Tests
        run: npx vitest run --reporter=verbose

  # ── Build Frontend ──────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://localhost:8000
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-ci
          VITE_SUPABASE_PROJECT_ID: ci-project

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Build Docker Images ────────────────────────────────────
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - service: api-gateway
            dockerfile: deploy/Dockerfile.api
          - service: brain-core
            dockerfile: deploy/Dockerfile.brain
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: sita-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Electron Desktop Build ────────────────────────────────
  build-electron:
    name: Build Electron (Linux)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Electron deps
        run: npm install --save-dev electron @electron/packager

      - name: Build frontend (Electron mode)
        run: ELECTRON_BUILD=1 npx vite build
        env:
          VITE_SUPABASE_URL: http://localhost:8000
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-ci
          VITE_SUPABASE_PROJECT_ID: ci-project

      - name: Package Electron (Linux x64)
        run: |
          npx @electron/packager . "SITA-OS" \
            --platform=linux --arch=x64 \
            --out=electron-release --overwrite \
            --ignore='node_modules' \
            --ignore='^/src' --ignore='^/public' \
            --ignore='^/scripts' --ignore='^/deploy' \
            --ignore='^/supabase' --ignore='^/e2e' \
            --ignore='^/tests' --ignore='^/\.github' \
            --ignore='^/electron-release'

      - name: Verify Electron output
        run: |
          ls -la electron-release/
          test -d electron-release/SITA-OS-linux-x64

  # ── Docker Compose Validation ──────────────────────────────
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy .env
        run: |
          cat > .env << 'EOF'
          POSTGRES_PASSWORD=ci-test-password-secure-enough
          JWT_SECRET=ci-test-jwt-secret-must-be-32-chars-long
          SUPABASE_ANON_KEY=ci-anon-key
          SUPABASE_SERVICE_KEY=ci-service-key
          VITE_SUPABASE_URL=http://localhost:8000
          VITE_SUPABASE_PUBLISHABLE_KEY=ci-anon-key
          EOF

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

  # ── Integration Tests ──────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-docker, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          POSTGRES_PASSWORD=integration-test-pwd-secure
          JWT_SECRET=integration-test-jwt-secret-32chars
          SUPABASE_ANON_KEY=test-anon-key
          SUPABASE_SERVICE_KEY=test-service-key
          VITE_SUPABASE_URL=http://localhost:8000
          VITE_SUPABASE_PUBLISHABLE_KEY=test-anon-key
          EOF

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Start stack
        run: |
          docker compose -f docker-compose.yml up -d \
            sita-supabase-db sita-supabase-rest sita-supabase-auth \
            sita-supabase-kong sita-api-gateway sita-brain-core

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1 && \
               curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "Services ready"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done

      - name: Run integration tests
        run: |
          API_GATEWAY_URL=http://localhost:3000 \
          BRAIN_CORE_URL=http://localhost:3001 \
          npx vitest run tests/integration/ --reporter=verbose

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Teardown
        if: always()
        run: docker compose down -v
