# ═══════════════════════════════════════════════════════════════
# SITA OS — Sentry Release Tagging + Sourcemap Upload
# Runs on every successful main/tag deploy. Activated only when
# SENTRY_DSN + SENTRY_AUTH_TOKEN secrets are present (otherwise
# the job logs "Sentry not configured" and exits 0 — never blocks).
# ═══════════════════════════════════════════════════════════════
name: Observability · Sentry Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: sentry-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag release + upload sourcemaps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Detect Sentry configuration
        id: detect
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_DSN" ] || [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sentry not configured — add SENTRY_DSN + SENTRY_AUTH_TOKEN to enable release tagging"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.detect.outputs.configured == 'true'
        run: npm ci

      - name: Build with sourcemaps
        if: steps.detect.outputs.configured == 'true'
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_BUILD_CHANNEL: ${{ github.ref_type == 'tag' && 'production' || 'beta' }}
          GENERATE_SOURCEMAP: "true"
        run: npm run build

      - name: Compute release tag
        if: steps.detect.outputs.configured == 'true'
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          PKG_VERSION=$(node -p "require('./package.json').version || '0.0.0'")
          echo "release=sita-os@${PKG_VERSION}+${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Sentry · create release + upload sourcemaps
        if: steps.detect.outputs.configured == 'true'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'sita-os' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'sita-os-web' }}
        with:
          environment: ${{ github.ref_type == 'tag' && 'production' || 'beta' }}
          version: ${{ steps.tag.outputs.release }}
          sourcemaps: dist
          set_commits: auto

      - name: Emit release receipt
        if: always()
        run: |
          mkdir -p generated
          node -e "
          const fs = require('fs');
          fs.writeFileSync('generated/sentry-release-receipt.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            commit: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            configured: '${{ steps.detect.outputs.configured }}' === 'true',
            release: '${{ steps.tag.outputs.release || 'n/a' }}',
          }, null, 2));"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentry-release-receipt
          path: generated/sentry-release-receipt.json
          retention-days: 90
          if-no-files-found: warn
