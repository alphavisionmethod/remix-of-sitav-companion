# ═══════════════════════════════════════════════════════════════
# SITA OS — Android Bootstrap Native Runtime
# Generates the real `android/` Capacitor project on ubuntu-latest
# (no Mac required), overlays android-templates/, builds debug APK,
# and either uploads the artifact or opens a PR with the project.
# ═══════════════════════════════════════════════════════════════
name: Android · Bootstrap Native Runtime

on:
  workflow_dispatch:
    inputs:
      commit_back:
        description: "Open a PR adding android/ to the repo"
        required: true
        default: "false"
        type: choice
        options: [ "true", "false" ]

concurrency:
  group: android-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Generate Android project + build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-templates/app/build.gradle') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://localhost:8000' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'dummy' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'ci' }}

      - name: Add Android platform (idempotent)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already present — skipping cap add"
          fi

      - name: Overlay android-templates → android/
        run: |
          if [ -d "android-templates/app" ]; then
            mkdir -p android/app
            rsync -av --exclude='google-services.json.template' \
              android-templates/app/ android/app/
            echo "Overlay applied"
          fi

      - name: Drop FCM credentials (when secret present)
        env:
          FCM_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FCM_JSON" ]; then
            echo "$FCM_JSON" > android/app/google-services.json
            echo "✓ google-services.json written — FCM enabled"
          else
            echo "⚠  FCM_SERVICE_ACCOUNT_JSON not set — push notifications will be no-op"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"

      - uses: actions/upload-artifact@v4
        with:
          name: sita-os-android-debug
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Open PR with android/ project (when requested)
        if: ${{ inputs.commit_back == 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(android): commit generated Capacitor project"
          branch: bootstrap/android-native
          title: "Android Native Runtime — generated"
          body: |
            This PR adds the real `android/` Capacitor project produced by
            the Android · Bootstrap Native Runtime workflow.

            Verify the debug APK artifact attached to the workflow run, then merge.
            After merge, `release-android.yml` can produce signed AABs.
          add-paths: android
