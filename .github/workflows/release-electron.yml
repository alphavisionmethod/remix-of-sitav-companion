# ═══════════════════════════════════════════════════════════════════
# SITA OS — Release · Electron (CONSOLIDATED)
# This workflow is now SUPERSEDED by desktop-build.yml which handles
# the full cross-platform matrix build with signing and manifests.
# Kept as a thin redirect to avoid breaking existing tag-based refs.
# ═══════════════════════════════════════════════════════════════════
name: "Release · Electron (→ Desktop Matrix)"

on:
  workflow_dispatch:

permissions:
  contents: read

permissions:
  contents: read

concurrency:
  group: release-electron-redirect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redirect:
    name: Redirect to canonical desktop-build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notice
        run: |
          echo "::notice::This workflow is superseded by 'Release · Desktop Matrix' (desktop-build.yml)."
          echo "::notice::Use workflow_dispatch on desktop-build.yml or push a v*-desktop tag."
          echo "## ℹ️ Consolidated" >> $GITHUB_STEP_SUMMARY
          echo "Desktop builds are now handled by **desktop-build.yml**." >> $GITHUB_STEP_SUMMARY
          echo "Trigger via \`workflow_dispatch\` or push a \`v*-desktop\` tag." >> $GITHUB_STEP_SUMMARY
