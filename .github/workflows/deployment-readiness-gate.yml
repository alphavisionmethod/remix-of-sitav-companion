# ═══════════════════════════════════════════════════════════════
# SITA OS — Deployment Readiness Gate (BLOCKING)
# Runs `npm run test:deployment-readiness` and the threshold-drift
# regression suite. This gate is REQUIRED to merge to main.
# ═══════════════════════════════════════════════════════════════
name: Deployment Readiness Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  deployment-readiness:
    name: test:deployment-readiness (REQUIRED)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Trust action manifest freshness (REQUIRED)
        run: npx tsx scripts/architecture/check-trust-action-manifest.ts

      - name: Phase 5 — Memory provenance coverage (REQUIRED)
        run: node scripts/ci/check-memory-provenance-coverage.mjs

      - name: Phase 5 — Knowledge spine manifest freshness (REQUIRED)
        run: node scripts/ci/check-knowledge-spine-manifest.mjs --check

      - name: Phase 6 — Semantic spine manifest freshness (REQUIRED)
        run: node scripts/ci/check-semantic-spine-manifest.mjs --check

      - name: Phase 7 — Live Cortex manifest freshness (REQUIRED)
        run: node scripts/ci/check-live-cortex-manifest.mjs --check

      - name: Phase 8 — Federation + voice→agent + multi-modal manifest (REQUIRED)
        run: node scripts/ci/check-phase-8-manifest.mjs

      - name: Phase 9 — Federated retrieval + agent multi-modal manifest (REQUIRED)
        run: node scripts/ci/check-phase-9-manifest.mjs

      - name: Phase 10 — Federated attribution + cross-workspace approvals manifest (REQUIRED)
        run: node scripts/ci/check-phase-10-manifest.mjs

      - name: Phase 11 — Citation enforcement + auto cross-workspace approvals manifest (REQUIRED)
        run: node scripts/ci/check-phase-11-manifest.mjs

      # ────────────────────────────────────────────────────────────────────
      # Repository Tree Canonicalization — Wave 1 validators (WARN-only).
      # See docs/architecture/REPOSITORY_CONSTITUTION.md and
      # generated/audits/repository-canonicalization-plan.md.
      # Each subsequent wave flips the relevant validator to STRICT mode.
      # ────────────────────────────────────────────────────────────────────
      - name: Repo canonicalization — module ownership (WARN)
        run: npx tsx scripts/architecture/check-module-ownership.ts --warn
        continue-on-error: true

      - name: Repo canonicalization — pages thin-adapter (WARN)
        run: npx tsx scripts/architecture/check-pages-thin-adapter.ts
        continue-on-error: true

      - name: Repo canonicalization — no duplicate platform folders (WARN)
        run: npx tsx scripts/architecture/check-no-duplicate-platform.ts
        continue-on-error: true

      - name: Repo canonicalization — generated/docs lifecycle (WARN)
        run: npx tsx scripts/architecture/check-generated-vs-docs.ts
        continue-on-error: true

      - name: Repo canonicalization — refresh baseline snapshot
        run: npx tsx scripts/architecture/emit-canonicalization-baseline.ts

      - name: Run deployment-readiness gate
        run: npm run test:deployment-readiness

      - name: Run threshold-drift regression
        run: npx vitest run src/__tests__/regression/threshold-drift-regression.test.ts --reporter=verbose

      - name: Generate gate summary
        if: always()
        run: |
          echo "## 🚦 Deployment Readiness Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f generated/key-artifact-freshness-report.json ]; then
            OK=$(node -e "console.log(JSON.parse(require('fs').readFileSync('generated/key-artifact-freshness-report.json','utf8')).ok)")
            ICON=$( [ "$OK" = "true" ] && echo "✅" || echo "❌" )
            echo "- $ICON Key artifact freshness: $OK" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f generated/threshold-drift-regression-report.json ]; then
            echo "- ✅ Threshold-drift regression: report emitted" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This gate is REQUIRED to merge. Failure blocks the PR." >> $GITHUB_STEP_SUMMARY

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-readiness-reports
          path: |
            generated/key-artifact-freshness-report.json
            generated/threshold-drift-regression-report.json
            generated/deployment-readiness-report.json
            generated/audits/repository-canonicalization-baseline.json
          retention-days: 30
          if-no-files-found: warn