# ═══════════════════════════════════════════════════════════════════
# SITA OS — Deploy Frontend (Future Monorepo)
# Currently DEFERRED — the repo is a single Vite app using npm.
# This workflow will activate when the repo migrates to a pnpm
# workspace with apps/ subdirectories.
# ═══════════════════════════════════════════════════════════════════
name: Deploy Frontend (Deferred)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm monorepo migration is complete"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-readiness:
    name: Verify Monorepo Structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check for monorepo structure
        run: |
          if [ ! -f "pnpm-workspace.yaml" ]; then
            echo "::error::This workflow requires pnpm workspace. Use deploy.yml for current single-app deployment."
            exit 1
          fi
          echo "✅ Monorepo structure detected"
