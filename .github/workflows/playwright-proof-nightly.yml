# ═══════════════════════════════════════════════════════
# SITA OS — Playwright Proof Nightly
# Runs full behavioral proof suite twice daily
# ═══════════════════════════════════════════════════════

name: Playwright Proof (Nightly)

on:
  schedule:
    - cron: '30 5 * * *'  # 5:30am UTC (staggered from customer-journey at 6am/6pm)
    - cron: '30 17 * * *' # 5:30pm UTC
  workflow_dispatch:
    inputs:
      subset:
        description: 'Test subset (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  nightly-proof:
    name: Nightly Behavioral Proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Run Full Suite
        run: |
          npx serve dist -l 8080 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 > /dev/null && break || sleep 1
          done

          TEST_ARGS=""
          if [ -n "${{ github.event.inputs.subset }}" ]; then
            TEST_ARGS="--grep '${{ github.event.inputs.subset }}'"
          fi

          PLAYWRIGHT_BASE_URL=http://localhost:8080 npx playwright test \
            --reporter=html,list,./tests/e2e/reporters/journey-reporter.ts \
            $TEST_ARGS \
            || true

          kill $SERVER_PID 2>/dev/null || true

          if [ -f test-results/journey-reports/proof-summary.md ]; then
            cat test-results/journey-reports/proof-summary.md >> $GITHUB_STEP_SUMMARY
          fi
        env:
          CI: true
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-evidence-${{ github.run_number }}
          path: test-results/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-proof-summary-${{ github.run_number }}
          path: test-results/journey-reports/
          retention-days: 60
