name: Release Gates

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/release/**"
      - "scripts/root/**"
      - "scripts/architecture/**"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "scripts/release/**"
      - "scripts/root/**"
      - "scripts/architecture/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Run release:all-targets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run release readiness gates
        run: |
          npm run release:all-targets
          echo "## 🚦 Release Gates" >> $GITHUB_STEP_SUMMARY
          for f in generated/*-release-readiness-report.json; do
            [ -f "$f" ] || continue
            NAME=$(basename "$f" .json)
            READY=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$f','utf8')).deploymentReady || false)")
            ICON=$( [ "$READY" = "true" ] && echo "✅" || echo "❌" )
            echo "| $NAME | $ICON $READY |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-reports
          path: generated/*-release-readiness-report.json
          retention-days: 30
          if-no-files-found: warn