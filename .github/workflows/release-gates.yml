name: Release Readiness Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gates:
    name: Run release:all-targets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run all release readiness gates
        run: npm run release:all-targets

      - name: Upload readiness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-reports
          path: generated/*-release-readiness-report.json
          retention-days: 30
          if-no-files-found: warn