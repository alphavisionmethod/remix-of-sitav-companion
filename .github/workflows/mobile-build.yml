name: mobile-build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'capacitor.config.ts'
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'capacitor.config.ts'
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      with_fcm:
        description: 'Bake google-services.json into the Android build'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Web build (shared upstream artifact) ─────────────────────
  web-build:
    name: web-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  # ─── Android: unsigned AAB always; signed AAB if keystore present
  android:
    name: android-aab
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3

      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Capacitor sync (Android)
        run: |
          npx cap add android || true
          npx cap sync android
          # Stamp permission template
          cat mobile/android/AndroidManifest.permissions.xml >> android/app/src/main/AndroidManifest.notes.xml || true

      - name: Inject google-services.json (optional)
        if: ${{ inputs.with_fcm == true && env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Build unsigned AAB
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Sign AAB (if keystore secret present)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          jarsigner -keystore /tmp/keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"

      - uses: actions/upload-artifact@v4
        with:
          name: sita-os-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # ─── iOS: unsigned IPA on macos-14; signed IPA if cert secret present
  ios:
    name: ios-ipa
    needs: web-build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Capacitor sync (iOS)
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Stamp Info.plist + PrivacyInfo
        run: |
          cp mobile/ios/Info.plist.template       ios/App/App/Info.plist.sita-template || true
          cp mobile/ios/PrivacyInfo.xcprivacy     ios/App/App/PrivacyInfo.xcprivacy || true

      - name: Build unsigned archive
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export unsigned IPA
        working-directory: ios/App
        run: |
          mkdir -p build/ipa
          # Without signing we cannot produce a real .ipa — we ship the .xcarchive
          ditto -c -k --sequesterRsrc --keepParent build/App.xcarchive build/ipa/sita-os-unsigned.xcarchive.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sita-os-ios-archive
          path: ios/App/build/ipa/*
          if-no-files-found: warn

  # ─── Readiness gate ───────────────────────────────────────────
  readiness:
    name: mobile-store-readiness
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/architecture/checks/check-mobile-store-readiness.ts
      - run: npx tsx scripts/architecture/checks/check-mobile-build-pipeline.ts
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-readiness-reports
          path: |
            generated/mobile-store-readiness-report.json
            generated/mobile-build-pipeline-report.json
