# ═══════════════════════════════════════════════════════════════════
# SITA OS — Build All Planes (Future Monorepo)
# Currently DEFERRED — the repo is a single Vite app using npm.
# This workflow will activate when the repo migrates to a pnpm
# workspace with per-plane build targets.
# CI typecheck + build coverage is handled by ci.yml.
# ═══════════════════════════════════════════════════════════════════
name: Build All Planes (Deferred)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm monorepo migration is complete"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-readiness:
    name: Verify Monorepo Structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check for monorepo structure
        run: |
          if [ ! -f "pnpm-workspace.yaml" ]; then
            echo "::error::This workflow requires pnpm workspace. Typecheck/build runs via ci.yml for current single-app structure."
            exit 1
          fi
