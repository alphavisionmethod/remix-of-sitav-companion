# ═══════════════════════════════════════════════════════════════════
# SITA OS — Architecture Boundary Checks
# Runs plane boundary and import boundary validators on PR and push.
# Uses npm (canonical package manager for this repo).
# ═══════════════════════════════════════════════════════════════════
name: Architecture Boundaries

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: boundaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-check:
    name: Boundary Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Run architecture boundary checker
        run: npx tsx scripts/architecture/check-plane-boundaries.ts

      - name: Run import boundary checker
        run: npx tsx scripts/check-import-boundaries.ts

      - name: Run engine purity checker
        run: npx tsx scripts/architecture/check-engine-purity.ts

      - name: Run canonical domain barrel non-empty checker (Phase 7)
        run: npx tsx scripts/architecture/audits/check-no-empty-domain-barrels.ts

      - name: Run Investment route namespace checker (Phase 7)
        run: npx tsx scripts/architecture/audits/check-investment-route-namespace.ts

      - name: Emit + check continuity handoffs (Phase 10 — enforcing)
        env:
          CONTINUITY_HANDOFFS_ENFORCE: ${{ vars.CONTINUITY_HANDOFFS_ENFORCE || 'true' }}
        run: |
          npx tsx scripts/architecture/emit-continuity-baseline.ts
          npx tsx scripts/architecture/check-continuity-handoffs.ts

      - name: Run Business OS production-truth checker
        # Phased rollout: failures are gated by BUSINESS_TRUTH_ENFORCE
        # so the check publishes signal during the closure phases and
        # flips to blocking once Phase 7 lands.
        env:
          BUSINESS_TRUTH_ENFORCE: ${{ vars.BUSINESS_TRUTH_ENFORCE || 'false' }}
        run: |
          set +e
          npx tsx scripts/architecture/check-business-truth.ts
          status=$?
          if [ "$BUSINESS_TRUTH_ENFORCE" = "true" ] && [ "$status" -ne 0 ]; then
            echo "::error::Business OS production-truth gate is enforcing and failed."
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Business OS production-truth violations detected (non-blocking until BUSINESS_TRUTH_ENFORCE=true)."
          fi
          exit 0

      - name: Run Admin (Mission Control) production-truth checker
        # Phased rollout: failures are gated by ADMIN_TRUTH_ENFORCE so
        # the check publishes signal during Phase 9 and flips to
        # blocking once Wave B closes (Phase 9.4).
        env:
          ADMIN_TRUTH_ENFORCE: ${{ vars.ADMIN_TRUTH_ENFORCE || 'false' }}
        run: |
          set +e
          npx tsx scripts/architecture/check-admin-truth.ts
          status=$?
          if [ "$ADMIN_TRUTH_ENFORCE" = "true" ] && [ "$status" -ne 0 ]; then
            echo "::error::Admin production-truth gate is enforcing and failed."
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Admin production-truth violations detected (non-blocking until ADMIN_TRUTH_ENFORCE=true)."
          fi
          exit 0

      - name: Run Concierge production-truth checker
        # Phased rollout: failures are gated by CONCIERGE_TRUTH_ENFORCE
        # so the check publishes signal during Phase 4 closure and
        # flips to blocking once the manifest reaches steady state.
        env:
          CONCIERGE_TRUTH_ENFORCE: ${{ vars.CONCIERGE_TRUTH_ENFORCE || 'false' }}
        run: |
          set +e
          npx tsx scripts/architecture/check-concierge-truth.ts
          status=$?
          if [ "$CONCIERGE_TRUTH_ENFORCE" = "true" ] && [ "$status" -ne 0 ]; then
            echo "::error::Concierge production-truth gate is enforcing and failed."
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Concierge production-truth violations detected (non-blocking until CONCIERGE_TRUTH_ENFORCE=true)."
          fi
          exit 0

      - name: Run Finance production-truth checker
        # Phased rollout: failures are gated by FINANCE_TRUTH_ENFORCE
        # so the check publishes signal during Phase 5 closure and
        # flips to blocking once the manifest reaches steady state.
        env:
          FINANCE_TRUTH_ENFORCE: ${{ vars.FINANCE_TRUTH_ENFORCE || 'false' }}
        run: |
          set +e
          npx tsx scripts/architecture/check-finance-truth.ts
          status=$?
          if [ "$FINANCE_TRUTH_ENFORCE" = "true" ] && [ "$status" -ne 0 ]; then
            echo "::error::Finance production-truth gate is enforcing and failed."
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Finance production-truth violations detected (non-blocking until FINANCE_TRUTH_ENFORCE=true)."
          fi
          exit 0

      - name: Run Health production-truth checker
        env:
          HEALTH_TRUTH_ENFORCE: ${{ vars.HEALTH_TRUTH_ENFORCE || 'false' }}
        run: |
          set +e
          npx tsx scripts/architecture/check-health-truth.ts
          status=$?
          if [ "$HEALTH_TRUTH_ENFORCE" = "true" ] && [ "$status" -ne 0 ]; then
            echo "::error::Health production-truth gate is enforcing and failed."
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Health production-truth violations detected (non-blocking until HEALTH_TRUTH_ENFORCE=true)."
          fi
          exit 0

      - name: Run Trust production-truth checker
        env:
          TRUST_TRUTH_ENFORCE: ${{ vars.TRUST_TRUTH_ENFORCE || 'false' }}
        run: |
          set +e
          npx tsx scripts/architecture/check-trust-truth.ts
          status=$?
          if [ "$TRUST_TRUTH_ENFORCE" = "true" ] && [ "$status" -ne 0 ]; then
            echo "::error::Trust production-truth gate is enforcing and failed."
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Trust production-truth violations detected (non-blocking until TRUST_TRUTH_ENFORCE=true)."
          fi
          exit 0

      - name: Run Mobile production-truth checker
        env:
          MOBILE_TRUTH_ENFORCE: ${{ vars.MOBILE_TRUTH_ENFORCE || 'false' }}
        run: |
          set +e
          npx tsx scripts/architecture/check-mobile-truth.ts
          status=$?
          if [ "$MOBILE_TRUTH_ENFORCE" = "true" ] && [ "$status" -ne 0 ]; then
            echo "::error::Mobile production-truth gate is enforcing and failed."
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Mobile production-truth violations detected (non-blocking until MOBILE_TRUTH_ENFORCE=true)."
          fi
          exit 0

      - name: Run Intelligence production-truth checker
        env:
          INTELLIGENCE_TRUTH_ENFORCE: ${{ vars.INTELLIGENCE_TRUTH_ENFORCE || 'false' }}
        run: |
          set +e
          npx tsx scripts/architecture/check-intelligence-truth.ts
          status=$?
          if [ "$INTELLIGENCE_TRUTH_ENFORCE" = "true" ] && [ "$status" -ne 0 ]; then
            echo "::error::Intelligence production-truth gate is enforcing and failed."
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Intelligence production-truth violations detected (non-blocking until INTELLIGENCE_TRUTH_ENFORCE=true)."
          fi
          exit 0

      - name: Run Personal Brain production-truth checker
        env:
          PERSONAL_BRAIN_TRUTH_ENFORCE: ${{ vars.PERSONAL_BRAIN_TRUTH_ENFORCE || 'false' }}
        run: |
          set +e
          # Personal Brain shares the Intelligence manifest/checker until it
          # gets its own pages root; this entry reserves the enforce gate.
          npx tsx scripts/architecture/check-intelligence-truth.ts
          status=$?
          if [ "$PERSONAL_BRAIN_TRUTH_ENFORCE" = "true" ] && [ "$status" -ne 0 ]; then
            echo "::error::Personal Brain production-truth gate is enforcing and failed."
            exit "$status"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Personal Brain production-truth violations detected (non-blocking until PERSONAL_BRAIN_TRUTH_ENFORCE=true)."
          fi
          exit 0

      - name: Run mutation traceability gate
        env:
          MUTATION_UNDECLARED_THRESHOLD: "242"
        run: npx tsx scripts/architecture/checks/check-edge-function-mutation-traceability.ts

      - name: Run hook & context ownership checker
        # Phases 4–7 closed (2026-04-27): 11 contexts and 139 hooks were
        # relocated to their canonical owners; the exception ledger
        # `shims[]` array is empty (no transitional re-exports remain).
        # The ownership map is clean under BOTH --enforce and
        # --enforce-classification, so the gate runs in full BLOCKING mode
        # for both hard import boundaries AND classification drift. The
        # five whitelisted survivors (useRealityProvider, use-flagship-loop-proof,
        # use-domain-data, use-cai-data, useCAIData) are tracked in
        # generated/manifests/hook-context-ownership-exceptions.json under
        # `rationale` (decision: keep-shared) and skipped by the validator.
        # See docs/architecture/HOOK_AND_CONTEXT_OWNERSHIP_MODEL.md and
        # REPOSITORY_CONSTITUTION.md rule #51.
        env:
          HOOK_CONTEXT_OWNERSHIP_ENFORCE: ${{ vars.HOOK_CONTEXT_OWNERSHIP_ENFORCE || 'true' }}
          HOOK_CONTEXT_OWNERSHIP_VERBOSE: 'true'
        run: npx tsx scripts/architecture/check-hook-context-ownership.ts --enforce-classification

      - name: Upload mutation traceability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-traceability-report
          path: generated/edge-function-mutation-traceability.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload boundary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-report
          path: generated/boundary-check-report.json
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Phase 7 architecture guard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-architecture-guard-reports
          path: |
            generated/empty-domain-barrels-report.json
            generated/investment-route-namespace-report.json
          retention-days: 14
          if-no-files-found: warn
