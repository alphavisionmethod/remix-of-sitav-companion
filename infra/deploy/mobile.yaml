# SITA OS — Mobile Deployment Manifest
# Canonical stack: Capacitor over Lovable SPA (NOT Flutter — Flutter was abandoned).
# Posture: secondary supported distribution surface, honestly deferred on external blockers.
apiVersion: deploy/v1
kind: MobileDeployment
metadata:
  name: sita-mobile
  plane: mobile
  stack: capacitor
  posture: secondary-distribution-surface

spec:
  platform:
    capacitor:
      version: "6"
      web_runtime: lovable-spa
      min_sdk:
        ios: "16.0"
        android: "26"
      target_sdk:
        android: "34"

  build:
    ios:
      runner: macos-14
      bootstrap: scripts/release/ios/build-ios.sh
      signing:
        team_id: "${APPLE_TEAM_ID}"
        provisioning_profile_b64: "${APPLE_PROVISIONING_PROFILE_BASE64}"
        certificate_b64: "${APPLE_DISTRIBUTION_CERT_P12_BASE64}"
        certificate_password: "${APPLE_DISTRIBUTION_CERT_PASSWORD}"
        appstore_api_key_id: "${APP_STORE_CONNECT_API_KEY_ID}"
        appstore_api_issuer_id: "${APP_STORE_CONNECT_API_ISSUER_ID}"
        appstore_api_key_p8_b64: "${APP_STORE_CONNECT_API_KEY_P8_BASE64}"
      capabilities:
        - push-notifications  # gated until APNs key provisioned
        - associated-domains
        - keychain-sharing
        - face-id
      entitlements:
        aps_environment: production
        keychain_access_groups:
          - "${APPLE_TEAM_ID}.com.sita.os"
      blocker_class: account-blocked

    android:
      runner: ubuntu-latest
      bootstrap: scripts/android/bootstrap.sh
      release: scripts/release/android/build-android.sh
      signing:
        keystore_path: "${ANDROID_KEYSTORE_PATH}"
        keystore_password: "${ANDROID_KEYSTORE_PASSWORD}"
        key_alias: "${ANDROID_KEY_ALIAS}"
        key_password: "${ANDROID_KEY_PASSWORD}"
        package_name: "${ANDROID_PACKAGE_NAME}"
      permissions:
        - android.permission.USE_BIOMETRIC
        - android.permission.USE_FINGERPRINT
        - android.permission.INTERNET
        - android.permission.RECEIVE_BOOT_COMPLETED
        - android.permission.VIBRATE
      features:
        - android.hardware.fingerprint
        - android.hardware.camera
      blocker_class: secret-blocked

  push_notifications:
    transport_resolution:
      web: vapid          # active
      ios: apns           # deferred — gated on Apple membership
      android: fcm        # deferred — gated on FCM credentials
    apns:
      status: deferred
      blocker: APNs key requires Apple Developer membership
      key_id: "${APNS_KEY_ID}"
      team_id: "${APPLE_TEAM_ID}"
      bundle_id: "com.sita.os"
      environment: production
    fcm:
      status: deferred
      blocker: google-services.json + service-account JSON (see mobile/android/FCM.md)
      project_id: "${FIREBASE_PROJECT_ID}"
      sender_id: "${FCM_SENDER_ID}"

  security:
    certificate_pinning:
      enabled: true
      pins:
        - host: "api.sita.os"
          sha256: "${API_CERT_SHA256}"
    biometric_auth:
      required_for:
        - approvals
        - payment_execution
        - settings_changes
      fallback: device_passcode
    secure_storage:
      ios: keychain
      android: android_keystore
    attestation:
      ios: app_attest
      android: play_integrity

  api:
    base_url: "${API_BASE_URL}"
    websocket_url: "${WS_BASE_URL}"
    timeout_ms: 30000
    retry:
      max_attempts: 3
      backoff: exponential
