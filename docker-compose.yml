services:
  # ── Traefik Reverse Proxy (TLS Termination) ────────────────────
  sita-traefik:
    image: traefik:v3.0
    container_name: sita-traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-certs:/letsencrypt
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@sita.local}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - sita-frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Frontend ────────────────────────────────────────────────────
  sita-web:
    image: nginx:alpine
    container_name: sita-web
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}
    depends_on:
      sita-api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - sita-frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── API Gateway ─────────────────────────────────────────────────
  sita-api-gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: sita-api-gateway
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BRAIN_CORE_URL=http://sita-brain-core:3001
      - SUPABASE_URL=http://sita-supabase-kong:8000
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - EDGE_FUNCTIONS_URL=http://sita-supabase-functions:9000
      - SITE_URL=${SITE_URL:-http://localhost:8080}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-500}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
    depends_on:
      sita-supabase-db:
        condition: service_healthy
      sita-brain-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - sita-frontend
      - sita-backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Brain Core ──────────────────────────────────────────────────
  sita-brain-core:
    build:
      context: .
      dockerfile: deploy/Dockerfile.brain
    container_name: sita-brain-core
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SUPABASE_URL=http://sita-supabase-kong:8000
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - NATS_URL=nats://sita-nats:4222
    depends_on:
      sita-supabase-db:
        condition: service_healthy
      sita-nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    networks:
      - sita-backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── NATS JetStream ─────────────────────────────────────────────
  sita-nats:
    image: nats:2.10-alpine
    container_name: sita-nats
    command: ["--jetstream", "--store_dir=/data", "-p", "4222", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - sita-backend
      - sita-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Supabase: PostgreSQL ────────────────────────────────────────
  sita-supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: sita-supabase-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./deploy/db-init/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./deploy/db-init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    networks:
      - sita-data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ── Supabase: PostgREST ────────────────────────────────────────
  sita-supabase-rest:
    image: postgrest/postgrest:v12.0.2
    container_name: sita-supabase-rest
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@sita-supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public,extensions}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      sita-supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - sita-backend
      - sita-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Supabase: Realtime ─────────────────────────────────────────
  sita-supabase-realtime:
    image: supabase/realtime:v2.28.32
    container_name: sita-supabase-realtime
    environment:
      PORT: 4000
      DB_HOST: sita-supabase-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    depends_on:
      sita-supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/api/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - sita-backend
      - sita-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Supabase: Postgres Meta ─────────────────────────────────────
  sita-supabase-meta:
    image: supabase/postgres-meta:v0.80.0
    container_name: sita-supabase-meta
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: sita-supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      sita-supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - sita-backend
      - sita-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Supabase: Edge Functions Runtime ───────────────────────────
  sita-supabase-functions:
    image: supabase/edge-runtime:v1.54.6
    container_name: sita-supabase-functions
    command: ["start", "--main-service", "/home/deno/functions/main"]
    environment:
      SUPABASE_URL: http://sita-supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_DB_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@sita-supabase-db:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      DENO_SERVE_ADDRESS: 0.0.0.0:9000
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
    depends_on:
      sita-supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health > /dev/null || true"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - sita-backend
      - sita-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Supabase: Kong API Gateway ──────────────────────────────────
  sita-supabase-kong:
    image: kong:2.8.1
    container_name: sita-supabase-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,rate-limiting
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    volumes:
      - ./deploy/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      sita-supabase-db:
        condition: service_healthy
      sita-supabase-rest:
        condition: service_healthy
      sita-supabase-meta:
        condition: service_healthy
      sita-supabase-auth:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - sita-frontend
      - sita-backend
      - sita-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Supabase: GoTrue Auth ──────────────────────────────────────
  sita-supabase-auth:
    image: supabase/gotrue:v2.143.0
    container_name: sita-supabase-auth
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@sita-supabase-db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:8080}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    depends_on:
      sita-supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - sita-backend
      - sita-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Supabase: Storage ──────────────────────────────────────────
  sita-supabase-storage:
    image: supabase/storage-api:v0.46.4
    container_name: sita-supabase-storage
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@sita-supabase-db:5432/postgres
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      GLOBAL_S3_BUCKET: stub
      IS_MULTITENANT: "false"
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - supabase-storage-data:/var/lib/storage
    depends_on:
      sita-supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/status > /dev/null || true"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    networks:
      - sita-backend
      - sita-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Supabase: Studio (Database UI) ─────────────────────────────
  sita-supabase-studio:
    image: supabase/studio:20240101-8e4a094
    container_name: sita-supabase-studio
    profiles:
      - studio
    environment:
      STUDIO_PG_META_URL: http://sita-supabase-meta:8080
      SUPABASE_URL: http://sita-supabase-kong:8000
      SUPABASE_REST_URL: http://sita-supabase-kong:8000/rest/v1/
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      NEXT_PUBLIC_ENABLE_LOGS: "true"
      DEFAULT_ORGANIZATION_NAME: "SITA OS"
      DEFAULT_PROJECT_NAME: "SITA"
    depends_on:
      sita-supabase-meta:
        condition: service_healthy
      sita-supabase-kong:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - sita-frontend
      - sita-backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  supabase-db-data:
    driver: local
  supabase-storage-data:
    driver: local
  nats-data:
    driver: local
  traefik-certs:
    driver: local

networks:
  sita-frontend:
    driver: bridge
    name: sita-frontend
  sita-backend:
    driver: bridge
    name: sita-backend
    internal: true
  sita-data:
    driver: bridge
    name: sita-data
    internal: true
